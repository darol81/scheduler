name: Nightly

# The full suite, including the 13 Playwright specs, against the real Supabase
# project. Kept off pull requests for two reasons: it needs secrets a fork can
# never have, and it mutates live data in two shared accounts.
on:
  schedule:
    # 02:17 UTC. Cron does not follow Finnish daylight saving, so this is
    # 05:17 in summer and 04:17 in winter -- close enough for a nightly.
    # Off the hour on purpose: GitHub's cron queue is congested at :00 and
    # runs scheduled there are the first to be delayed or dropped.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The `secrets` context is not available in a job-level `if:`, so the check
  # has to happen inside a step and be published as an output. The point is
  # that a repo without the secrets configured gets a SKIPPED e2e job rather
  # than a red one -- this workflow can land before anything is set up.
  preflight:
    name: preflight
    # A fork inherits the schedule but never the secrets, so without this its
    # Actions tab fills up with runs that cannot succeed.
    if: github.repository == 'darol81/scheduler'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PW: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ] && [ -n "$PW" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Supabase secrets are not set - skipping the end-to-end job. See CONTRIBUTING.md.'
          fi

  e2e:
    name: e2e
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest

    # One Supabase project, two fixed accounts. e2e/global-setup.js empties
    # both before the first spec, so a second run starting mid-flight would
    # delete the first run's live data. This serialises every end-to-end run
    # in the repository; cancel-in-progress must stay false, or a manual
    # dispatch would kill the nightly instead of queueing behind it.
    concurrency:
      group: supabase-e2e
      cancel-in-progress: false

    env:
      # e2e/helpers/env.js goes through Vite's loadEnv(), which merges matching
      # keys from process.env over anything on disk -- so no .env files need to
      # exist on the runner. E2E_EMAIL_A/B are omitted deliberately: the
      # built-in defaults already match the allowlist in supabase/e2e.sql, and
      # overriding them here would only let the two drift apart.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}

      # Runs even on a cache hit: `install` no-ops on a browser that is already
      # there, but --with-deps still apt-installs the OS libraries, which live
      # outside ~/.cache/ms-playwright and are never restored by the cache.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the dev server itself (webServer in
      # playwright.config.js, reuseExistingServer: false), so nothing may
      # occupy the port beforehand -- --strictPort would abort the run.
      - run: npm run e2e

      - name: Leave the test accounts empty
        if: always()
        continue-on-error: true
        run: npm run e2e:reset

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
